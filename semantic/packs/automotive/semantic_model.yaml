# ══════════════════════════════════════════
# HIERARCHIES
# ══════════════════════════════════════════
hierarchies:

  Date_Hierarchy:
    display_name: "Date Hierarchy"
    dimension: Date
    levels:
      - name: Year
        expression: "strftime('%Y', sales_date)"
      - name: Quarter
        expression: >
          CASE WHEN CAST(strftime('%m', sales_date) AS INTEGER) BETWEEN 1 AND 3
            THEN 'Q1-' || strftime('%Y', sales_date)
          WHEN CAST(strftime('%m', sales_date) AS INTEGER) BETWEEN 4 AND 6
            THEN 'Q2-' || strftime('%Y', sales_date)
          WHEN CAST(strftime('%m', sales_date) AS INTEGER) BETWEEN 7 AND 9
            THEN 'Q3-' || strftime('%Y', sales_date)
          ELSE 'Q4-' || strftime('%Y', sales_date) END
      - name: Month
        expression: "strftime('%Y-%m', sales_date)"
      - name: Day
        expression: "sales_date"

  Vehicle_Hierarchy:
    display_name: "Vehicle Hierarchy"
    dimension: Car
    levels:
      - name: Make
        column: make
      - name: Car Type
        column: car_type
      - name: Model
        column: model
      - name: Car Line
        column: carline_name

  Region_Hierarchy:
    display_name: "Region Hierarchy"
    dimension: Region
    levels:
      - name: Country
        column: country
      - name: Region
        column: region_name
      - name: State
        column: state_code
      - name: City
        column: city

# ══════════════════════════════════════════
# DRILL PATHS
# ══════════════════════════════════════════
drill_paths:

  - name: "Time Drill"
    path: [Year, Quarter, Month, Day]

  - name: "Vehicle Drill"
    path: [Make, Car Type, Model, Car Line]

  - name: "Region Drill"
    path: [Country, Region, State, City]

  - name: "Dealer Drill"
    path: [Region, City, Dealer Name]

  - name: "Target Drill"
    path: [Make, Target Month]

# ══════════════════════════════════════════
# BUSINESS ENTITIES
# ══════════════════════════════════════════
business_entities:

  - name: "Sales Transaction"
    table: fact_sales
    description: "A single vehicle sale event"

  - name: "Vehicle"
    table: dim_carline
    description: "A vehicle product in the catalogue"

  - name: "Salesperson"
    table: dim_salesman
    description: "A member of the sales team"

  - name: "Colour Variant"
    table: dim_color
    description: "A colour option for a vehicle"

  - name: "Region"
    table: dim_region
    description: "A geographic sales region / city"

  - name: "Sales Target"
    table: dim_targets
    description: "Monthly unit/revenue plan by make (2024–2025)"

  - name: "Dealer"
    table: dim_dealer
    description: "Authorized dealer outlet mapped to city and region"