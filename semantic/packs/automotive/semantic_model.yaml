# semantic_model.yaml
# Enterprise Semantic Layer — Automotive Sales Domain
# Capgemini AI Data Platform V10

version: "1.0"
domain: "Automotive Sales"
description: >
  India passenger-vehicle sales analytics (2019–2026). Reflects COVID volume dip (2020),
  recovery and boom (2021–2025), rising EV share, and market leadership of Maruti, Tata,
  and Mahindra across metro and regional India.

# ══════════════════════════════════════════
# TABLES
# ══════════════════════════════════════════
tables:

  fact_sales:
    type: fact
    physical_name: fact_sales
    display_name: "Sales Transactions"
    grain: "One row per sales order"
    description: "Core fact table containing all sales transactions"
    primary_key: order_id
    columns:
      order_id:
        display_name: "Order ID"
        type: integer
        role: key
      carline_id:
        display_name: "Car Line ID"
        type: integer
        role: foreign_key
        references: dim_carline.carline_id
      colour_id:
        display_name: "Colour ID"
        type: integer
        role: foreign_key
        references: dim_color.colour_id
      sales_person_id:
        display_name: "Salesperson ID"
        type: integer
        role: foreign_key
        references: dim_salesman.sales_person_id
      region_id:
        display_name: "Region ID"
        type: integer
        role: foreign_key
        references: dim_region.region_id
      sales_date:
        display_name: "Sales Date"
        type: date
        role: date
      order_qty:
        display_name: "Order Quantity"
        type: integer
        role: measure
      price_per_unit:
        display_name: "Price Per Unit"
        type: decimal
        role: measure
      total_sales:
        display_name: "Total Sales Value"
        type: decimal
        role: measure

  dim_carline:
    type: dimension
    physical_name: dim_carline
    display_name: "Vehicle / Car Line"
    description: "Vehicle catalogue dimension"
    primary_key: carline_id
    columns:
      carline_id:
        display_name: "Car Line ID"
        type: integer
        role: key
      carline_name:
        display_name: "Car Line Name"
        type: string
        role: attribute
      model:
        display_name: "Model"
        type: string
        role: attribute
      make:
        display_name: "Make / Brand"
        type: string
        role: attribute
      car_type:
        display_name: "Car Type"
        type: string
        role: attribute
      engine_capacity:
        display_name: "Engine Capacity"
        type: decimal
        role: attribute
      engine_type:
        display_name: "Engine Type"
        type: string
        role: attribute

  dim_color:
    type: dimension
    physical_name: dim_color
    display_name: "Colour / Paint"
    description: "Vehicle colour and paint dimension"
    primary_key: colour_id
    columns:
      colour_id:
        display_name: "Colour ID"
        type: integer
        role: key
      colour_name:
        display_name: "Colour Name"
        type: string
        role: attribute
      RCG_combination:
        display_name: "RCG Combination"
        type: string
        role: attribute
      patent_number:
        display_name: "Patent Number"
        type: string
        role: attribute

  dim_salesman:
    type: dimension
    physical_name: dim_salesman
    display_name: "Salesperson"
    description: "Sales team member dimension"
    primary_key: sales_person_id
    columns:
      sales_person_id:
        display_name: "Salesperson ID"
        type: integer
        role: key
      first_name:
        display_name: "First Name"
        type: string
        role: attribute
      last_name:
        display_name: "Last Name"
        type: string
        role: attribute
      email:
        display_name: "Email"
        type: string
        role: attribute
      corp_id:
        display_name: "Corporate ID"
        type: string
        role: attribute
      active:
        display_name: "Active Status"
        type: boolean
        role: attribute

  dim_region:
    type: dimension
    physical_name: dim_region
    display_name: "Region / Geography"
    description: "Sales region and city geography dimension"
    primary_key: region_id
    columns:
      region_id:
        display_name: "Region ID"
        type: integer
        role: key
      region_name:
        display_name: "Region Name"
        type: string
        role: attribute
      city:
        display_name: "City"
        type: string
        role: attribute
      state_code:
        display_name: "State Code"
        type: string
        role: attribute
      country:
        display_name: "Country"
        type: string
        role: attribute

  dim_targets:
    type: dimension
    physical_name: dim_targets
    display_name: "Sales Targets by Make"
    grain: "One row per make per month"
    description: >
      Monthly unit and revenue targets by vehicle make from Jan 2024 through Dec 2025.
      Use with fact_sales via make and sales month for plan vs actual analysis.
    primary_key: target_id
    columns:
      target_id:
        display_name: "Target ID"
        type: integer
        role: key
      year_month:
        display_name: "Target Month"
        type: string
        role: attribute
        description: "YYYY-MM format, e.g. 2024-06"
      make:
        display_name: "Make / Brand"
        type: string
        role: attribute
        references: dim_carline.make
      target_units:
        display_name: "Target Units"
        type: integer
        role: measure
      target_revenue:
        display_name: "Target Revenue"
        type: decimal
        role: measure
      grain:
        display_name: "Target Grain"
        type: string
        role: attribute

  dim_dealer:
    type: dimension
    physical_name: dim_dealer
    display_name: "Dealer Network"
    grain: "One row per authorized dealer outlet"
    description: >
      Dealer master — each dealer maps to a city and sales region (region_id).
    primary_key: dealer_id
    columns:
      dealer_id:
        display_name: "Dealer ID"
        type: integer
        role: key
      dealer_code:
        display_name: "Dealer Code"
        type: string
        role: attribute
      dealer_name:
        display_name: "Dealer Name"
        type: string
        role: attribute
      city:
        display_name: "City"
        type: string
        role: attribute
        references: dim_region.city
      region_id:
        display_name: "Region ID"
        type: integer
        role: foreign_key
        references: dim_region.region_id
      region_name:
        display_name: "Region Name"
        type: string
        role: attribute
      state_code:
        display_name: "State Code"
        type: string
        role: attribute
      country:
        display_name: "Country"
        type: string
        role: attribute
      dealer_grade:
        display_name: "Dealer Grade"
        type: string
        role: attribute
      active:
        display_name: "Active"
        type: boolean
        role: attribute

# ══════════════════════════════════════════
# RELATIONSHIPS
# ══════════════════════════════════════════
relationships:
  - name: sales_to_carline
    from_table: fact_sales
    from_column: carline_id
    to_table: dim_carline
    to_column: carline_id
    type: many_to_one
    display_name: "Sales to Vehicle"

  - name: sales_to_colour
    from_table: fact_sales
    from_column: colour_id
    to_table: dim_color
    to_column: colour_id
    type: many_to_one
    display_name: "Sales to Colour"

  - name: sales_to_salesman
    from_table: fact_sales
    from_column: sales_person_id
    to_table: dim_salesman
    to_column: sales_person_id
    type: many_to_one
    display_name: "Sales to Salesperson"

  - name: sales_to_region
    from_table: fact_sales
    from_column: region_id
    to_table: dim_region
    to_column: region_id
    type: many_to_one
    display_name: "Sales to Region"

  - name: carline_to_targets
    from_table: dim_carline
    from_column: make
    to_table: dim_targets
    to_column: make
    type: many_to_one
    auto_join: false
    display_name: "Vehicle Make → Monthly Targets"
    join_condition: >
      dim_carline.make = dim_targets.make
      AND strftime('%Y-%m', fact_sales.sales_date) = dim_targets.year_month
    path: [fact_sales, dim_carline, dim_targets]

  - name: region_to_dealer
    from_table: dim_region
    from_column: region_id
    to_table: dim_dealer
    to_column: region_id
    type: one_to_many
    auto_join: false
    display_name: "Region → Dealers"
    path: [dim_region, dim_dealer]

  - name: city_to_dealer
    from_table: dim_region
    from_column: city
    to_table: dim_dealer
    to_column: city
    type: one_to_many
    auto_join: false
    display_name: "City → Dealers"
    path: [dim_region, dim_dealer]

join_paths:
  target_vs_actual:
    description: "Compare actual sales to monthly make targets (2024–2025)"
    tables: [fact_sales, dim_carline, dim_targets]
    join_sql: >
      fact_sales fs
      JOIN dim_carline dc ON fs.carline_id = dc.carline_id
      JOIN dim_targets dt ON dc.make = dt.make
        AND strftime('%Y-%m', fs.sales_date) = dt.year_month
  dealer_network:
    description: "Dealer outlets mapped to city and region"
    tables: [dim_dealer, dim_region]
    join_sql: >
      dim_dealer dd
      JOIN dim_region dr ON dd.region_id = dr.region_id
  sales_with_dealer_geo:
    description: "Sales attributed to dealer cities via region"
    tables: [fact_sales, dim_region, dim_dealer]
    join_sql: >
      fact_sales fs
      JOIN dim_region dr ON fs.region_id = dr.region_id
      JOIN dim_dealer dd ON dd.region_id = dr.region_id

# ══════════════════════════════════════════
# MEASURES
# ══════════════════════════════════════════
measures:

  revenue:
    display_name: "Revenue"
    description: "Total sales revenue generated"
    expression: "SUM(total_sales)"
    format: "currency"
    aggregation: sum
    source_table: fact_sales
    source_column: total_sales
    synonyms:
      - sales
      - turnover
      - income
      - total revenue
      - total sales
      - gross sales
      - total income
      - sales value
      - sales amount
      - revenue generated
      - money made
      - earnings

  orders:
    display_name: "Orders"
    description: "Total number of orders placed"
    expression: "COUNT(order_id)"
    format: "integer"
    aggregation: count
    source_table: fact_sales
    source_column: order_id
    synonyms:
      - order count
      - number of orders
      - total orders
      - transactions
      - purchases
      - deals
      - bookings
      - sales count

  units_sold:
    display_name: "Units Sold"
    description: "Total quantity of vehicles sold"
    expression: "SUM(order_qty)"
    format: "integer"
    aggregation: sum
    source_table: fact_sales
    source_column: order_qty
    synonyms:
      - quantity sold
      - volume
      - units
      - vehicles sold
      - cars sold
      - order quantity
      - qty sold
      - total units
      - sales volume
      - number sold
      - top selling
      - best selling
      - most sold
      - top seller
      - best seller
      - top selling car
      - best selling car
      - top selling model
      - most popular

  average_selling_price:
    display_name: "Average Selling Price"
    description: "Average price per unit sold"
    expression: "SUM(total_sales) / NULLIF(SUM(order_qty), 0)"
    format: "currency"
    aggregation: ratio
    source_table: fact_sales
    synonyms:
      - avg price
      - average price
      - mean price
      - price per unit
      - asp
      - average unit price
      - avg selling price

  active_salespeople:
    display_name: "Active Salespeople"
    description: "Count of distinct active salespeople"
    expression: "COUNT(DISTINCT sales_person_id)"
    format: "integer"
    aggregation: count_distinct
    source_table: fact_sales
    source_column: sales_person_id
    synonyms:
      - active reps
      - active agents
      - headcount
      - sales team size
      - number of salespeople
      - distinct salespeople

  revenue_per_salesperson:
    display_name: "Revenue Per Salesperson"
    description: "Average revenue generated per salesperson"
    expression: "SUM(total_sales) / NULLIF(COUNT(DISTINCT sales_person_id), 0)"
    format: "currency"
    aggregation: ratio
    source_table: fact_sales
    synonyms:
      - revenue per rep
      - revenue per agent
      - sales per person
      - per head revenue
      - productivity
      - sales productivity

  revenue_per_order:
    display_name: "Revenue Per Order"
    description: "Average revenue value per order"
    expression: "SUM(total_sales) / NULLIF(COUNT(order_id), 0)"
    format: "currency"
    aggregation: ratio
    source_table: fact_sales
    synonyms:
      - average order value
      - avg order value
      - aov
      - order value
      - basket size
      - value per transaction

  target_units:
    display_name: "Target Units"
    description: "Planned unit volume by make and month from dim_targets"
    expression: "SUM(target_units)"
    format: "integer"
    aggregation: sum
    source_table: dim_targets
    source_column: target_units
    synonyms:
      - target volume
      - plan units
      - planned units
      - budget units
      - target qty
      - sales target units

  target_revenue:
    display_name: "Target Revenue"
    description: "Planned revenue by make and month from dim_targets"
    expression: "SUM(target_revenue)"
    format: "currency"
    aggregation: sum
    source_table: dim_targets
    source_column: target_revenue
    synonyms:
      - target sales
      - plan revenue
      - budget revenue
      - revenue target
      - sales target value

  variance_units:
    display_name: "Unit Variance vs Target"
    description: "Actual units minus target units (requires join to dim_targets)"
    expression: "SUM(order_qty) - SUM(target_units)"
    format: "integer"
    aggregation: ratio
    source_table: fact_sales
    synonyms:
      - gap to target
      - variance units
      - vs target units
      - target gap

# ══════════════════════════════════════════
