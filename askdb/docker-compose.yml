name: nql-insight

services:
  postgres:
    image: postgres:16-alpine
    container_name: nql-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/app/00_bootstrap.sql:/docker-entrypoint-initdb.d/00_bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: nql-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: nql-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: nql-api
    env_file:
      - .env
    environment:
      # Container-internal hostnames override the localhost defaults in .env.
      APP_DATABASE_URL: postgresql+psycopg://askdb_app:${ASKDB_APP_PASSWORD:-askdb_app}@postgres:5432/askdb_app
      AUTOMOTIVE_DATABASE_URL: postgresql+psycopg://askdb_reader:${ASKDB_READER_PASSWORD:-askdb_reader}@postgres:5432/askdb_automotive
      INSURANCE_DATABASE_URL: postgresql+psycopg://askdb_reader:${ASKDB_READER_PASSWORD:-askdb_reader}@postgres:5432/askdb_insurance
      AUTOMOTIVE_MIGRATE_DATABASE_URL: postgresql+psycopg://askdb_owner:${ASKDB_OWNER_PASSWORD:-askdb_owner}@postgres:5432/askdb_automotive
      INSURANCE_MIGRATE_DATABASE_URL: postgresql+psycopg://askdb_owner:${ASKDB_OWNER_PASSWORD:-askdb_owner}@postgres:5432/askdb_insurance
      MONGODB_URI: mongodb://mongo:27017
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
  mongodata:
  qdrantdata:
