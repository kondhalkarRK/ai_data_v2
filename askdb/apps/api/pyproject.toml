[project]
name = "nql-insight-api"
version = "0.1.0"
description = "NQL Insight API - governed natural language analytics over PostgreSQL."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0.36,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "pyjwt>=2.9,<3",
    "python-multipart>=0.0.12,<1",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
    "orjson>=3.10,<4",
]

[project.optional-dependencies]
analytics = [
    "pandas>=2.2,<3",
    "duckdb>=1.1,<2",
]
rag = [
    "pymongo>=4.10,<5",
    "qdrant-client>=1.12,<2",
    "pypdf>=5.1,<6",
    "python-docx>=1.1,<2",
    "python-pptx>=1.0,<2",
    "beautifulsoup4>=4.12,<5",
]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6.0,<7",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "types-pyyaml",
    # Tests run the ORM against SQLite so the suite needs no live PostgreSQL.
    "aiosqlite>=0.20,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"migrations/*" = ["N999", "E501"]
"app/analytics/*" = ["S311"]  # deterministic synthetic data, not cryptography
"scripts/*" = ["S608"]
"app/api/routes/*" = ["B008"]  # FastAPI Depends/Query/File defaults
"app/services/kpi/*" = ["S608", "SIM108"]
"app/services/chat/*" = ["E501"]
"app/services/kpi/windows.py" = ["E501", "SIM108"]
"app/services/kpi/insurance.py" = ["E501", "S608"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["qdrant_client.*", "pptx.*", "docx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
