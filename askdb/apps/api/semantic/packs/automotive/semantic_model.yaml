business_entities:
  - {name: Sales Transaction, table: fact_sales, description: A single vehicle sale event}
  - {name: Vehicle, table: dim_carline, description: A vehicle product in the catalogue (Sedan, SUV, Hatchback, …)}
  - {name: Salesperson, table: dim_salesman, description: A member of the sales team (person — not a dealer)}
  - {name: Colour Variant, table: dim_color, description: A paint option for a vehicle}
  - {name: Region, table: dim_region, description: A geographic sales territory}
  - {name: Sales Target, table: dim_targets, description: Monthly unit and revenue plan by make}
  - {name: Dealer, table: dim_dealer, description: An authorized dealer outlet (not a salesperson)}

domain_rules:
  always_rules:
    - Revenue is SUM(total_sales); never use price_per_unit as revenue.
    - Units sold is SUM(order_qty), not order count.
    - Top selling defaults to units sold unless the user explicitly asks for revenue.
    - Protect every ratio denominator with NULLIF.
    - Salesperson questions join dim_salesman and return first_name || last_name AS salesperson_name.
    - Dealer questions join dim_dealer and return dealer_name — never confuse with salesperson.
    - Named body styles (Sedan, SUV, Hatchback, MUV, Coupe) require WHERE dim_carline.car_type = '<Type>'.
  never_rules:
    - Never show a raw identifier without its business label.
    - Never return more than the configured row cap.
    - Never answer salesperson questions with dealer rows.
    - Never omit an explicitly stated car_type filter.
