version: "2.0"
domain: Automotive Sales
terms:
  Revenue:
    definition: Total monetary value of completed vehicle sales.
    display_label: Revenue
    synonyms: [sales, turnover, income, gross sales, sales value, sales amount]
    category: Financial
    maps_to_measure: revenue
    sql_expression: "SUM(automotive.fact_sales.total_sales)"
    calculation_rules:
      - Use total_sales, never price_per_unit.
    example_questions:
      - Revenue by month
      - Highest revenue dealer

  Units Sold:
    definition: Total vehicle quantity sold; one order may contain multiple units.
    synonyms: [volume, cars sold, vehicles sold, top selling, best selling, most sold, units]
    category: Sales Volume
    maps_to_measure: units_sold
    sql_expression: "SUM(automotive.fact_sales.order_qty)"
    disambiguation:
      - Top selling means units sold unless revenue is named.
    example_questions:
      - Top selling sedan
      - Best selling model

  Orders:
    definition: Number of distinct sales orders.
    synonyms: [order count, transactions, deals]
    category: Sales Activity
    maps_to_measure: orders

  Average Selling Price:
    definition: Revenue divided by units sold.
    synonyms: [ASP, average price, price achieved]
    category: Pricing
    maps_to_measure: average_selling_price

  Vehicle:
    definition: A vehicle product identified by make, model, body style and powertrain.
    synonyms: [car, automobile, carline, model, make, brand]
    category: Product
    maps_to_dimension: Car
    calculation_rules:
      - Prefer make/model/car_type labels over IDs.
    related_terms: [Car Type, Electric Vehicle, Sedan, SUV, Hatchback]

  Car Type:
    definition: Body style / segment such as Sedan, SUV, Hatchback, MUV, Coupe.
    synonyms: [body type, vehicle type, body style, segment, class]
    category: Product
    maps_to_attribute: dim_carline.car_type
    sql_expression: "automotive.dim_carline.car_type"
    calculation_rules:
      - Filter with exact car_type values Sedan, SUV, Hatchback, MUV, Coupe.
    example_questions:
      - Top selling sedan
      - Units sold by car type

  Sedan:
    definition: Passenger cars with a three-box body style (Sedan).
    synonyms: [sedans, saloon, saloons]
    category: Product Filter
    maps_to_attribute: dim_carline.car_type
    sql_expression: "automotive.dim_carline.car_type = 'Sedan'"
    calculation_rules:
      - Always apply WHERE car_type = 'Sedan' when the user says sedan.
    related_terms: [Vehicle, Car Type, Units Sold]

  SUV:
    definition: Sport utility vehicles (SUV).
    synonyms: [suvs, sport utility, crossover]
    category: Product Filter
    maps_to_attribute: dim_carline.car_type
    sql_expression: "automotive.dim_carline.car_type = 'SUV'"
    calculation_rules:
      - Always apply WHERE car_type = 'SUV' when the user says SUV.

  Hatchback:
    definition: Hatchback body style vehicles.
    synonyms: [hatchbacks, hatch]
    category: Product Filter
    maps_to_attribute: dim_carline.car_type
    sql_expression: "automotive.dim_carline.car_type = 'Hatchback'"
    calculation_rules:
      - Always apply WHERE car_type = 'Hatchback' when the user says hatchback.

  Electric Vehicle:
    definition: A battery-electric passenger vehicle.
    synonyms: [EV, electric car, BEV, battery electric, electric]
    category: Product
    maps_to_dimension: Car
    sql_expression: "automotive.dim_carline.engine_type = 'Electric'"
    calculation_rules:
      - Filter engine_type = 'Electric'. Do not treat Hybrid as Electric.

  Colour:
    definition: Exterior paint colour or finish.
    synonyms: [color, paint, finish, shade]
    category: Product Attribute
    maps_to_dimension: Colour

  Salesperson:
    definition: >
      An individual member of the sales team who closes vehicle sales.
      Not a dealer outlet — use dim_salesman (first_name + last_name).
    display_label: Salesperson
    synonyms:
      - sales rep
      - sales representative
      - sales executive
      - sales consultant
      - sales advisor
      - seller
      - agent
      - account manager
      - sales person
      - salespeople
      - salesman
      - salesmen
      - who sold
    category: People
    maps_to_dimension: Salesperson
    sql_expression: "s.first_name || ' ' || s.last_name"
    calculation_rules:
      - Join automotive.dim_salesman on sales_person_id.
      - Rank by SUM(order_qty) unless revenue is explicit.
      - Alias the name as salesperson_name.
      - Never substitute dim_dealer for salesperson.
    disambiguation:
      - Salesperson is a person (dim_salesman), never a dealer outlet.
      - Dealer / dealership / showroom means dim_dealer, not salesperson.
    related_terms: [Dealer, Units Sold, Revenue]
    example_questions:
      - What is the top salesperson?
      - Top 10 salespeople by revenue
      - Who sold the most units?

  Dealer:
    definition: >
      An authorized vehicle sales outlet / dealership (dim_dealer).
      Not an individual salesperson.
    synonyms: [dealership, outlet, showroom, dealer network, authorized dealer]
    category: Network
    maps_to_dimension: Dealer
    calculation_rules:
      - Join automotive.dim_dealer on dealer_id.
      - Never substitute dim_salesman for dealer.
    disambiguation:
      - Dealer is an outlet; salesperson is a person on the sales team.
    related_terms: [Salesperson, Region, Revenue]
    example_questions:
      - Top dealer by revenue
      - Best performing dealer

  Region:
    definition: A geographic sales territory.
    synonyms: [geography, territory, city, state, location, market]
    category: Geography
    maps_to_dimension: Region
    calculation_rules:
      - Resolve named cities and regions against live dim_region values.
      - Preserve every explicitly named location as a mandatory SQL filter.

  Target Units:
    definition: Planned monthly unit volume by vehicle make.
    synonyms: [target volume, plan units, budget units]
    category: Planning
    maps_to_measure: target_units

  Target Revenue:
    definition: Planned monthly sales value by vehicle make.
    synonyms: [plan revenue, budget revenue, sales target value]
    category: Planning
    maps_to_measure: target_revenue

  Brand:
    definition: >
      The vehicle manufacturer (dim_carline.make). Canonical brands are Maruti Suzuki,
      Hyundai, Tata, Mahindra, MG, Kia, Toyota, Honda, Skoda, Volkswagen, Renault and Nissan.
    display_label: Brand (Make)
    synonyms: [make, manufacturer, OEM, carmaker, automaker, company]
    category: Product
    maps_to_attribute: dim_carline.make
    sql_expression: "automotive.dim_carline.make"
    calculation_rules:
      - Resolve brand synonyms to the canonical make (Maruti / Suzuki / MSIL -> Maruti Suzuki; Morris Garages / MG Motor -> MG).
      - A named brand is a mandatory filter; several named brands become make IN (...).
    example_questions:
      - Maruti sales by year
      - Top brand by revenue
      - Compare MG and Maruti sales

  MUV:
    definition: Multi-utility vehicles / MPVs (MUV).
    synonyms: [muvs, mpv, mpvs, people carrier]
    category: Product Filter
    maps_to_attribute: dim_carline.car_type
    sql_expression: "automotive.dim_carline.car_type = 'MUV'"

  Coupe:
    definition: Two-door coupe body style.
    synonyms: [coupes]
    category: Product Filter
    maps_to_attribute: dim_carline.car_type
    sql_expression: "automotive.dim_carline.car_type = 'Coupe'"

  Fuel Type:
    definition: Powertrain of the vehicle — Petrol, Diesel, Hybrid or Electric (dim_carline.engine_type).
    synonyms: [powertrain, engine type, fuel]
    category: Product
    maps_to_attribute: dim_carline.engine_type
    sql_expression: "automotive.dim_carline.engine_type"
    calculation_rules:
      - CNG is not recorded in the sales data; offer Petrol, Diesel, Hybrid or Electric instead.

  Petrol:
    definition: Petrol (gasoline) powered vehicles.
    synonyms: [gasoline]
    category: Product Filter
    maps_to_attribute: dim_carline.engine_type
    sql_expression: "automotive.dim_carline.engine_type = 'Petrol'"

  Diesel:
    definition: Diesel powered vehicles.
    synonyms: []
    category: Product Filter
    maps_to_attribute: dim_carline.engine_type
    sql_expression: "automotive.dim_carline.engine_type = 'Diesel'"

  Hybrid:
    definition: Hybrid powertrain vehicles (not battery-electric).
    synonyms: [hybrids, HEV, strong hybrid]
    category: Product Filter
    maps_to_attribute: dim_carline.engine_type
    sql_expression: "automotive.dim_carline.engine_type = 'Hybrid'"

  Location:
    definition: >
      The city where the sale was booked (dim_region.city). Common names resolve to the
      canonical city — Bombay -> Mumbai, Bangalore -> Bengaluru, Delhi -> New Delhi, Madras -> Chennai.
    synonyms: [city, town]
    category: Geography
    maps_to_attribute: dim_region.city
    sql_expression: "automotive.dim_region.city"
    example_questions:
      - Maruti sales in Mumbai
      - Revenue by city

  Market Share:
    definition: >
      A brand's (or segment's) share of total units or revenue in the selected period,
      computed as 100 * brand value / total value across all brands.
    synonyms: [share of market, brand share, share]
    category: Market
    calculation_rules:
      - Contribution percentage by make over the same filters and period.
    example_questions:
      - Market share by brand
      - Maruti market share by year

  Growth:
    definition: Period-over-period change of a metric (month over month or year over year).
    synonyms: [growth rate, yoy, mom, year over year, month over month, change]
    category: Market
    calculation_rules:
      - Compare each period with the previous one using LAG over the time grain.

  Profit:
    definition: >
      Revenue minus cost. The sales warehouse records selling prices only, so profit and
      profit margin cannot be computed; answer with revenue or average selling price instead.
    synonyms: [profits, gross profit, net profit, earnings]
    category: Financial
    calculation_rules:
      - Not available — no cost data in automotive.fact_sales.

  Profit Margin:
    definition: Profit as a percentage of revenue. Not available because cost data is not recorded.
    synonyms: [margin, margins, gross margin]
    category: Financial
    calculation_rules:
      - Not available — suggest average selling price or revenue instead.

domain_rules:
  always_rules:
    - SQL is the source of truth for numerical results.
    - Top selling defaults to SUM(order_qty) unless revenue is explicit.
    - Electric vehicle means engine_type = 'Electric'.
    - Sedan / SUV / Hatchback / MUV / Coupe must filter dim_carline.car_type exactly.
    - Top salesperson uses dim_salesman (person name), never dim_dealer.
    - Top dealer uses dim_dealer (outlet name), never dim_salesman.
    - Concatenate first_name and last_name as salesperson_name.
    - Named make, model, colour, city, region, state, engine type and dealer grade values are mandatory filters.
    - Lowest, worst, least and bottom rankings sort ascending; top, best, highest and most sort descending.
  never_rules:
    - Never rank top selling vehicles by revenue unless revenue is explicit.
    - Never confuse salesperson with dealer.
    - Never drop a stated body-style filter (Sedan, SUV, Hatchback, etc.).
    - Never invent columns or tables outside the active industry pack.
    - Never drop an explicitly named city, make, model, colour or region.
    - Never mix insurance tables or terminology into automotive SQL.

sql_patterns:
  top_n_query:
    description: Top / best / highest N ranking
    default_limit: 10
    trigger_words: [top, best, highest, most, leading]
  body_style_filter:
    description: Mandatory car_type filter when body style is named
    trigger_words: [sedan, suv, hatchback, muv, coupe]
