version: "2.0"
domain: Insurance
description: PostgreSQL insurance analytics with separate claim and premium grains.

tables:
  fact_claims:
    type: fact
    physical_name: insurance.fact_claims
    display_name: Claims
    grain: One row per claim
    primary_key: claim_id
    columns:
      claim_id: {display_name: Claim ID, type: bigint, role: key}
      claim_number: {display_name: Claim Number, type: string, role: attribute}
      policy_id: {display_name: Policy ID, type: bigint, role: foreign_key, references: dim_policy.policy_id}
      product_id: {display_name: Product ID, type: integer, role: foreign_key, references: dim_product.product_id}
      region_id: {display_name: Region ID, type: integer, role: foreign_key, references: dim_region.region_id}
      loss_date: {display_name: Loss Date, type: date, role: date}
      reported_date: {display_name: Reported Date, type: date, role: date}
      settlement_date: {display_name: Settlement Date, type: date, role: date, nullable: true}
      claim_status: {display_name: Claim Status, type: string, role: dimension}
      claim_type: {display_name: Claim Type, type: string, role: dimension}
      reported_amount: {display_name: Reported Amount, type: decimal, role: measure}
      approved_amount: {display_name: Approved Amount, type: decimal, role: measure}
      paid_amount: {display_name: Paid Amount, type: decimal, role: measure}
      reserve_amount: {display_name: Reserve Amount, type: decimal, role: measure}
      incurred_amount: {display_name: Incurred Amount, type: decimal, role: measure}
      approved_flag: {display_name: Approved, type: boolean, role: dimension}
      repudiated_flag: {display_name: Repudiated, type: boolean, role: dimension}
      fraud_suspected_flag: {display_name: Fraud Suspected, type: boolean, role: dimension}

  fact_policy_monthly:
    type: fact
    physical_name: insurance.fact_policy_monthly
    display_name: Policy Monthly Premium and Exposure
    grain: One row per policy per accounting month
    primary_key: policy_month_id
    columns:
      policy_month_id: {display_name: Policy Month ID, type: bigint, role: key}
      policy_id: {display_name: Policy ID, type: bigint, role: foreign_key, references: dim_policy.policy_id}
      product_id: {display_name: Product ID, type: integer, role: foreign_key, references: dim_product.product_id}
      agent_id: {display_name: Agent ID, type: integer, role: foreign_key, references: dim_agent.agent_id}
      region_id: {display_name: Region ID, type: integer, role: foreign_key, references: dim_region.region_id}
      accounting_month: {display_name: Accounting Month, type: date, role: date}
      written_premium: {display_name: Written Premium, type: decimal, role: measure}
      earned_premium: {display_name: Earned Premium, type: decimal, role: measure}
      exposure_units: {display_name: Exposure Units, type: decimal, role: measure}
      active_policy_flag: {display_name: Active Policy, type: boolean, role: dimension}
      due_for_renewal_flag: {display_name: Due for Renewal, type: boolean, role: dimension}
      renewed_flag: {display_name: Renewed, type: boolean, role: dimension}

  dim_policy:
    type: dimension
    physical_name: insurance.dim_policy
    display_name: Policy
    grain: One row per policy
    primary_key: policy_id
    columns:
      policy_id: {display_name: Policy ID, type: bigint, role: key}
      policy_number: {display_name: Policy Number, type: string, role: attribute}
      customer_key: {display_name: Customer Key, type: string, role: attribute}
      product_id: {display_name: Product ID, type: integer, role: foreign_key, references: dim_product.product_id}
      agent_id: {display_name: Agent ID, type: integer, role: foreign_key, references: dim_agent.agent_id}
      region_id: {display_name: Region ID, type: integer, role: foreign_key, references: dim_region.region_id}
      inception_date: {display_name: Inception Date, type: date, role: date}
      expiry_date: {display_name: Expiry Date, type: date, role: date}
      policy_status: {display_name: Policy Status, type: string, role: attribute}
      coverage_tier: {display_name: Coverage Tier, type: string, role: attribute}
      sum_insured: {display_name: Sum Insured, type: decimal, role: measure}

  dim_product:
    type: dimension
    physical_name: insurance.dim_product
    display_name: Product
    grain: One row per insurance product
    primary_key: product_id
    columns:
      product_id: {display_name: Product ID, type: integer, role: key}
      product_code: {display_name: Product Code, type: string, role: attribute}
      product_name: {display_name: Product Name, type: string, role: attribute}
      line_of_business: {display_name: Line of Business, type: string, role: attribute}
      product_family: {display_name: Product Family, type: string, role: attribute}
      coverage_type: {display_name: Coverage Type, type: string, role: attribute}

  dim_agent:
    type: dimension
    physical_name: insurance.dim_agent
    display_name: Agent
    grain: One row per insurance intermediary
    primary_key: agent_id
    columns:
      agent_id: {display_name: Agent ID, type: integer, role: key}
      agent_code: {display_name: Agent Code, type: string, role: attribute}
      agent_name: {display_name: Agent Name, type: string, role: attribute}
      channel_name: {display_name: Channel, type: string, role: attribute}
      branch_name: {display_name: Branch, type: string, role: attribute}
      active_flag: {display_name: Active, type: boolean, role: attribute}

  dim_region:
    type: dimension
    physical_name: insurance.dim_region
    display_name: Region
    grain: One row per insurance territory
    primary_key: region_id
    columns:
      region_id: {display_name: Region ID, type: integer, role: key}
      region_code: {display_name: Region Code, type: string, role: attribute}
      region_name: {display_name: Region, type: string, role: attribute}
      state_name: {display_name: State, type: string, role: attribute}
      country_name: {display_name: Country, type: string, role: attribute}

relationships:
  - {name: claims_to_policy, from_table: fact_claims, from_column: policy_id, to_table: dim_policy, to_column: policy_id, type: many_to_one}
  - {name: claims_to_product, from_table: fact_claims, from_column: product_id, to_table: dim_product, to_column: product_id, type: many_to_one}
  - {name: claims_to_region, from_table: fact_claims, from_column: region_id, to_table: dim_region, to_column: region_id, type: many_to_one}
  - {name: premium_to_policy, from_table: fact_policy_monthly, from_column: policy_id, to_table: dim_policy, to_column: policy_id, type: many_to_one}
  - {name: premium_to_product, from_table: fact_policy_monthly, from_column: product_id, to_table: dim_product, to_column: product_id, type: many_to_one}
  - {name: premium_to_agent, from_table: fact_policy_monthly, from_column: agent_id, to_table: dim_agent, to_column: agent_id, type: many_to_one}
  - {name: premium_to_region, from_table: fact_policy_monthly, from_column: region_id, to_table: dim_region, to_column: region_id, type: many_to_one}
  - {name: policy_to_product, from_table: dim_policy, from_column: product_id, to_table: dim_product, to_column: product_id, type: many_to_one}
  - {name: policy_to_agent, from_table: dim_policy, from_column: agent_id, to_table: dim_agent, to_column: agent_id, type: many_to_one}
  - {name: policy_to_region, from_table: dim_policy, from_column: region_id, to_table: dim_region, to_column: region_id, type: many_to_one}

measures:
  gross_written_premium: {display_name: Gross Written Premium, expression: "SUM(written_premium)", source_table: fact_policy_monthly, source_column: written_premium, aggregation: sum, format: currency, synonyms: [GWP, written premium, sales]}
  earned_premium: {display_name: Earned Premium, expression: "SUM(earned_premium)", source_table: fact_policy_monthly, source_column: earned_premium, aggregation: sum, format: currency}
  claims_incurred: {display_name: Claims Incurred, expression: "SUM(incurred_amount)", source_table: fact_claims, source_column: incurred_amount, aggregation: sum, format: currency}
  claims_paid: {display_name: Claims Paid, expression: "SUM(paid_amount)", source_table: fact_claims, source_column: paid_amount, aggregation: sum, format: currency}
  claim_count: {display_name: Claim Count, expression: "COUNT(DISTINCT claim_id)", source_table: fact_claims, source_column: claim_id, aggregation: count_distinct, format: integer}
  loss_ratio: {display_name: Loss Ratio, description: Incurred claims divided by earned premium at compatible grain, expression: "SUM(incurred_amount) / NULLIF(SUM(earned_premium), 0)", aggregation: ratio, format: percent}
  average_claim_severity: {display_name: Average Claim Severity, expression: "SUM(incurred_amount) / NULLIF(COUNT(DISTINCT claim_id), 0)", source_table: fact_claims, aggregation: ratio, format: currency}
  claim_frequency: {display_name: Claim Frequency, expression: "COUNT(DISTINCT claim_id) / NULLIF(SUM(exposure_units), 0)", aggregation: ratio, format: decimal}
  approval_rate: {display_name: Approval Rate, expression: "AVG(approved_flag::int)", source_table: fact_claims, aggregation: ratio, format: percent}
  renewal_rate: {display_name: Renewal Rate, expression: "COUNT(*) FILTER (WHERE renewed_flag) / NULLIF(COUNT(*) FILTER (WHERE due_for_renewal_flag), 0)", source_table: fact_policy_monthly, aggregation: ratio, format: percent}

dimensions:
  Reported Date: {display_name: Reported Date, source_table: fact_claims, source_column: reported_date, type: date, synonyms: [claim date, reported month]}
  Accounting Month: {display_name: Accounting Month, source_table: fact_policy_monthly, source_column: accounting_month, type: date, synonyms: [premium month, month, year]}
  Product: {display_name: Product, source_table: dim_product, attributes: [product_name, line_of_business, product_family, coverage_type], synonyms: [LOB, insurance product, policy type]}
  Region: {display_name: Region, source_table: dim_region, attributes: [region_name, state_name, country_name], synonyms: [territory, geography, state]}
  Agent: {display_name: Agent, source_table: dim_agent, attributes: [agent_name, channel_name, branch_name], synonyms: [broker, intermediary, advisor]}
  Policy: {display_name: Policy, source_table: dim_policy, attributes: [policy_number, customer_key, policy_status, coverage_tier], synonyms: [coverage, contract, customer, policyholder]}

hierarchies:
  Product: [line_of_business, product_family, product_name, coverage_type]
  Geography: [country_name, state_name, region_name]
  Distribution: [channel_name, branch_name, agent_name]
  Policy: [policy_status, coverage_tier, policy_number]
  Claim: [claim_status, claim_type, claim_number]

value_domains:
  claim_status: {table: fact_claims, column: claim_status, label: Claim Status, max_values: 30}
  claim_type: {table: fact_claims, column: claim_type, label: Claim Type, max_values: 50}
  policy_status: {table: dim_policy, column: policy_status, label: Policy Status, max_values: 20}
  coverage_tier: {table: dim_policy, column: coverage_tier, label: Coverage Tier, max_values: 20}
  product: {table: dim_product, column: product_name, label: Product, max_values: 100}
  line_of_business: {table: dim_product, column: line_of_business, label: Line of Business, max_values: 50, aliases: [LOB, business line]}
  product_family: {table: dim_product, column: product_family, label: Product Family, max_values: 50}
  coverage_type: {table: dim_product, column: coverage_type, label: Coverage Type, max_values: 50}
  channel: {table: dim_agent, column: channel_name, label: Channel, max_values: 30}
  branch: {table: dim_agent, column: branch_name, label: Branch, max_values: 100}
  region:
    table: dim_region
    column: region_name
    label: Region
    max_values: 100
    value_aliases:
      National Capital Region: [Delhi, NCR]
      Mumbai Metro: [Mumbai]
      Bengaluru Metro: [Bengaluru, Bangalore]
      Hyderabad Metro: [Hyderabad]
      Chennai Metro: [Chennai]
      Kolkata Metro: [Kolkata]
  state: {table: dim_region, column: state_name, label: State, max_values: 100}

business_entities:
  - {name: Claim, table: fact_claims, description: A reported insurance loss}
  - {name: Premium Exposure, table: fact_policy_monthly, description: Monthly premium and exposure for a policy}
  - {name: Policy, table: dim_policy, description: An insurance contract held by a customer}
  - {name: Product, table: dim_product, description: An insurance product and line of business}
  - {name: Agent, table: dim_agent, description: An intermediary who sells or services policies}
  - {name: Region, table: dim_region, description: A geographic insurance territory}

domain_rules:
  always_rules:
    - Premium must come from fact_policy_monthly, never fact_claims.
    - Loss ratio is incurred claims divided by earned premium at compatible grain.
    - Use reported_date for claims and accounting_month for premium.
    - Protect every ratio denominator with NULLIF.
  never_rules:
    - Never invent premium from claim rows.
    - Never return only an unnamed metric column for an analytical question.
