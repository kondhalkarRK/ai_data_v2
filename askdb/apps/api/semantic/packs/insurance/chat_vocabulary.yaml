# AI Chat-only vocabulary for insurance. Business values and synonyms live in
# semantic_model.yaml (value_domains); this file only holds conversational rules.
version: "1.0"

unavailable:
  - terms: [profit, profits, underwriting profit, combined ratio, expense ratio]
    kind: metric
    message: >
      Expenses aren't recorded in the insurance data, so profit and combined ratio can't
      be calculated. Loss ratio, claims incurred and earned premium are available.
    alternatives:
      - Loss ratio by line of business
      - Claims incurred by product
      - Earned premium by month
  - terms: [satisfaction, customer satisfaction, csat, nps, net promoter score, complaints,
            customer complaints, turnaround time, tat]
    kind: metric
    message: >
      Customer satisfaction, NPS and complaints aren't recorded in the insurance data.
      Premium, claims, loss ratio, renewal rate and claim approval rate are available.
    alternatives:
      - Renewal rate by channel
      - Claim approval rate by product
      - Loss ratio by line of business

generic_value_words: []

# Words that may look like names but are business vocabulary, never entities.
