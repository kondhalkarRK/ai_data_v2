  # ── DATA_FOLLOW_UP ──
  - id: fu-01
    industry: automotive
    label: DATA_FOLLOW_UP
    prior_turns:
      - message: "Revenue by region"
    message: "What about South?"
    expect:
      metric: revenue
      entity: metric_only
      dimensions: [region]
      filters: [South]
