# Chat routing evaluation set (Stage 0c).
# Fields:
#   label — expected routing class for a future classifier.
#   has_documents — optional; defaults false. Passed to query_router.route_question.
#   simulate_region_zones — harness-only RegionScope simulation.
#   expected_stage — optional; cases needing Stage 1+ are excluded from Stage 0 accuracy.
#   expect — optional plan assertions (metric, entity, dimensions, filters, time_grain).
#   prior_turns — list of {message}; harness threads prior_sql/plan_state through the chain.

version: 3
