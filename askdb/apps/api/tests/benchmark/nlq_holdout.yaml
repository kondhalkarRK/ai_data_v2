# Hold-out NLQ questions — same grading keys as nlq_benchmark.yaml.
#
# Written after the planner fixes and never used to tune them, so the score here
# estimates accuracy on unseen phrasing rather than on the tuning set.

cases:
  - {id: HO-01, industry: automotive, category: aggregation, question: "What was the total revenue in 2023?", metric: revenue, year: 2023}
  - {id: HO-02, industry: automotive, category: aggregation, question: "How many units did Toyota sell?", metric: units, filters: {make: [Toyota]}}
  - {id: HO-03, industry: automotive, category: aggregation, question: "Orders for Kia in Pune", metric: orders, filters: {make: [Kia], city: [Pune]}}
