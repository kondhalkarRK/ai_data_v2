  - {id: HO-35, industry: insurance, category: insurance_metrics, question: "Claim count by claim type", metric: claim_count, group: [claim_type]}
  - {id: HO-36, industry: insurance, category: insurance_metrics, question: "Loss ratio for Maharashtra by month", metric: loss_ratio, filters: {state_name: [Maharashtra]}, group: [month]}
  - {id: HO-37, industry: insurance, category: insurance_metrics, question: "Top 5 products by earned premium", metric: earned, group: [product], order: desc, limit: 5}
