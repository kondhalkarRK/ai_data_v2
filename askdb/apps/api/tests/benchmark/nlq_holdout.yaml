  - {id: HO-06, industry: automotive, category: trend, question: "Quarterly sales of Mahindra", metric: revenue, filters: {make: [Mahindra]}, group: [quarter]}
  - {id: HO-07, industry: automotive, category: trend, question: "Show the yearly units trend for electric cars", metric: units, filters: {engine_type: [Electric]}, group: [year]}
  - {id: HO-08, industry: automotive, category: ranking, question: "Bottom 5 models by revenue", metric: revenue, group: [model], order: asc, limit: 5}
