  - {id: HO-39, industry: automotive, category: followup, prior: "Toyota sales by month", question: "Show it by quarter instead", metric: revenue, filters: {make: [Toyota]}, group: [quarter]}
  - {id: HO-40, industry: insurance, category: followup, prior: "Written premium by product", question: "What about in Q1 2025?", metric: gwp, group: [product], period: ["2025-01-01", "2025-04-01"]}
