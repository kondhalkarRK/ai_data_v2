  - {id: HO-27, industry: automotive, category: vehicle_attributes, question: "Red car sales", metric: revenue, filters: {colour_name: [Fire Red, Crimson Metallic]}}
  - {id: HO-28, industry: automotive, category: vehicle_attributes, question: "Grey cars sold in 2025", metric: units, filters: {colour_name: [Graphite Grey, Nardo Grey, Storm Grey]}, year: 2025}
  - {id: HO-29, industry: automotive, category: vehicle_attributes, question: "Petrol vs diesel units by year", metric: units, filters: {engine_type: [Petrol, Diesel]}, group: [year]}
