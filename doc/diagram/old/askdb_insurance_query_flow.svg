<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="ASK-DB insurance query flow">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/>
    </marker>
    <style>
      .t { font-family: Segoe UI, system-ui, sans-serif; }
      .title { font-size: 18px; font-weight: 700; fill: #e6edf3; }
      .h { font-size: 13px; font-weight: 650; fill: #e6edf3; }
      .s { font-size: 11px; fill: #8b949e; }
      .note { font-size: 12px; fill: #8b949e; }
    </style>
  </defs>
  <rect width="1200" height="640" fill="#0f1419" rx="12"/>
  <text x="40" y="36" class="t title">ASK-DB insurance  end-to-end query flow</text>
  <text x="40" y="56" class="t note">Warehouse (~1.5M claims) stays in PostgreSQL. Streamlit receives a bounded answer frame only.</text>

  <!-- Step boxes row 1 -->
  <rect x="40" y="90" width="150" height="78" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="115" y="120" text-anchor="middle" class="t h">1. User</text>
  <text x="115" y="140" text-anchor="middle" class="t s">Chat question</text>
  <text x="115" y="156" text-anchor="middle" class="t s">or chip pick</text>

  <line x1="190" y1="129" x2="220" y2="129" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="220" y="90" width="170" height="78" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="305" y="120" text-anchor="middle" class="t h">2. Streamlit</text>
  <text x="305" y="140" text-anchor="middle" class="t s">Session + spinner</text>
  <text x="305" y="156" text-anchor="middle" class="t s">Incomplete check</text>

  <line x1="390" y1="129" x2="420" y2="129" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="420" y="90" width="190" height="78" rx="10" fill="#161b22" stroke="#d29922"/>
  <text x="515" y="120" text-anchor="middle" class="t h">3. Clarify (optional)</text>
  <text x="515" y="140" text-anchor="middle" class="t s">2 insurance suggestions</text>
  <text x="515" y="156" text-anchor="middle" class="t s">e.g. East / show claims</text>

  <line x1="610" y1="129" x2="640" y2="129" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="640" y="90" width="200" height="78" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="740" y="120" text-anchor="middle" class="t h">4. NLQ engine</text>
  <text x="740" y="140" text-anchor="middle" class="t s">Cache · OOB · anchor</text>
  <text x="740" y="156" text-anchor="middle" class="t s">run_query path</text>

  <line x1="840" y1="129" x2="870" y2="129" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="870" y="90" width="280" height="78" rx="10" fill="#161b22" stroke="#2f81f7"/>
  <text x="1010" y="120" text-anchor="middle" class="t h">5. LLM + semantic YAML</text>
  <text x="1010" y="140" text-anchor="middle" class="t s">Glossary · domain rules</text>
  <text x="1010" y="156" text-anchor="middle" class="t s">PostgreSQL SELECT only</text>

  <!-- Row 2 -->
  <line x1="1010" y1="168" x2="1010" y2="220" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="870" y="220" width="280" height="88" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="1010" y="250" text-anchor="middle" class="t h">6. Guardrails + Backend</text>
  <text x="1010" y="270" text-anchor="middle" class="t s">Read-only · wrap LIMIT 1001</text>
  <text x="1010" y="286" text-anchor="middle" class="t s">~30s statement timeout</text>

  <line x1="870" y1="264" x2="720" y2="264" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="440" y="220" width="280" height="88" rx="10" fill="#161b22" stroke="#3fb950"/>
  <text x="580" y="250" text-anchor="middle" class="t h">7. PostgreSQL warehouse</text>
  <text x="580" y="270" text-anchor="middle" class="t s">1.5M claims · premium months</text>
  <text x="580" y="286" text-anchor="middle" class="t s">Aggregates &amp; joins stay here</text>

  <line x1="440" y1="264" x2="300" y2="264" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="40" y="220" width="260" height="88" rx="10" fill="#161b22" stroke="#3fb950"/>
  <text x="170" y="250" text-anchor="middle" class="t h">8. Tiny result frame</text>
  <text x="170" y="270" text-anchor="middle" class="t s">d 1,000 rows into app</text>
  <text x="170" y="286" text-anchor="middle" class="t s">Often 450 for aggregates</text>

  <!-- Row 3 results -->
  <line x1="170" y1="308" x2="170" y2="360" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="40" y="360" width="260" height="88" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="170" y="390" text-anchor="middle" class="t h">9. Format</text>
  <text x="170" y="410" text-anchor="middle" class="t s">Dates · 1-based index</text>
  <text x="170" y="426" text-anchor="middle" class="t s">PII mask on display</text>

  <line x1="300" y1="404" x2="360" y2="404" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="360" y="360" width="280" height="88" rx="10" fill="#161b22" stroke="#2f81f7"/>
  <text x="500" y="390" text-anchor="middle" class="t h">10. Chat result UI</text>
  <text x="500" y="410" text-anchor="middle" class="t s">Table display d 100 rows</text>
  <text x="500" y="426" text-anchor="middle" class="t s">Insight · Chart · Evidence</text>

  <line x1="640" y1="404" x2="700" y2="404" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="700" y="360" width="450" height="88" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="925" y="390" text-anchor="middle" class="t h">11. Parallel tabs (same rule)</text>
  <text x="925" y="410" text-anchor="middle" class="t s">KPI = windowed aggregates · Preview LIMIT 100</text>
  <text x="925" y="426" text-anchor="middle" class="t s">DQ = COUNT inventory + rolling quality windows</text>

  <text x="40" y="500" class="t note">Volume contract: Postgres scans millions ’ app gets d1,000 ’ chat paints d100. Never load full fact tables into Streamlit.</text>
  <text x="40" y="524" class="t note">Semantic examples: East’dim_region · Motor’LOB · GWP/earned from fact_policy_monthly · ranks via ROW_NUMBER starting at 1.</text>
  <text x="40" y="560" class="t note">Files: doc/diagram/askdb_insurance_query_flow.svg · leadership notes: doc/ASKDB_INSURANCE_LEADERSHIP_NOTES.md</text>
  <text x="40" y="600" class="t s">ASK-DB · insurance PostgreSQL pilot · Capgemini AI Data Platform</text>
</svg>
