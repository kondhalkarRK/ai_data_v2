# Copy to secrets.toml for local runs, or paste into Streamlit Cloud → Settings → Secrets.
# Never commit real passwords.

# ── Local laptop (Postgres on this machine) ───────────────────────
DATA_BACKEND = "postgres"
INDUSTRY_PACK = "insurance"
# Soft-fallback to CSV upload mode if Postgres is down (default true)
POSTGRES_FALLBACK_CSV = "true"

[postgres]
host = "localhost"
port = 5432
database = "askdb_dev"
user = "askdb_app"
password = "CHANGE_ME"
schema = "insurance"
sslmode = "prefer"

# ── Streamlit Community Cloud ─────────────────────────────────────
# Option A — CSV/DuckDB demos (no warehouse):
#   DATA_BACKEND = "csv_duckdb"
#
# Option B — remote Postgres (Neon / Supabase / RDS / etc.).
# localhost WILL NOT work on Cloud — that hostname is the cloud container.
#
# DATA_BACKEND = "postgres"
# INDUSTRY_PACK = "insurance"
#
# [postgres]
# host = "ep-xxxx.region.aws.neon.tech"
# port = 5432
# database = "askdb_dev"
# user = "askdb_app"
# password = "CHANGE_ME"
# schema = "insurance"
# sslmode = "require"
#
# Or use a single URI instead of discrete fields:
# connection_url = "postgresql://user:pass@ep-xxxx.region.aws.neon.tech/askdb_dev?sslmode=require"
