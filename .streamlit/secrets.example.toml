# Copy these keys into Streamlit Cloud:
#   App → Settings → Secrets
#
# Do NOT commit real keys to GitHub.

CAPGEMINI_LLM_API_KEY = "paste-your-api-key-here"
CAPGEMINI_LLM_BASE_URL = "https://openai.generative.engine.capgemini.com/v1"
CAPGEMINI_LLM_MODEL = "openai.gpt-5.1"

# Keep "csv_duckdb" for the current upload flow. Change to "postgres" only
# after creating askdb_dev and the read-only askdb_app role.
DATA_BACKEND = "csv_duckdb"
INDUSTRY_PACK = "automotive"

[postgres]
host = "localhost"
port = 5432
database = "askdb_dev"
user = "askdb_app"
password = "replace-with-app-user-password"
schema = "insurance"
sslmode = "prefer"
connect_timeout_seconds = 10
statement_timeout_seconds = 30
max_result_rows = 1000
pool_min_size = 1
pool_max_size = 5
